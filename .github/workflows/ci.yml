name: CI

on:
  push:
    branches: [main, "phase/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - name: Install ruff
        run: uv tool install ruff
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  pytest-main:
    name: Tests (Flask app)
    runs-on: ubuntu-latest
    needs: ruff
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dfpos
          POSTGRES_PASSWORD: dfpos
          POSTGRES_DB: dfpos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dfpos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      FLASK_ENV: testing
      SECRET_KEY: ci-secret-key
      TEST_DATABASE_URL: postgresql+psycopg://dfpos:dfpos@localhost:5432/dfpos_test
      DATABASE_URL: postgresql+psycopg://dfpos:dfpos@localhost:5432/dfpos_test
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      AUDIT_LOG_BASE_URL: http://localhost:8090
      AUDIT_LOG_TOKEN: ci-audit-token
      AUDIT_LOG_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run main app tests
        run: uv run pytest -v --tb=short -q tests/ services/audit-log/app/tests/ services/intelligence/app/tests/

  # trend-scout-tests: validates the Trend Scout microservice.
  # Phase 1: smoke tests only (no DB/Redis required for the smoke suite).
  # Later phases: extend to include a Postgres service and full test suite.
  trend-scout-tests:
    name: Tests (Trend Scout microservice)
    runs-on: ubuntu-latest
    needs: ruff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - name: Install dependencies
        working-directory: services/trend-scout
        run: uv sync --all-extras
      - name: Ruff check
        working-directory: services/trend-scout
        run: uv run ruff check .
      - name: Ruff format check
        working-directory: services/trend-scout
        run: uv run ruff format --check .
      - name: Run microservice tests
        working-directory: services/trend-scout
        run: uv run pytest -v --tb=short -q
