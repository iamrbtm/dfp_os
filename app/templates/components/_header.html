<header class="glass-nav" x-data="{ menuOpen: false }" @keydown.escape.window="menuOpen = false" @click.outside="menuOpen = false" role="banner">
  <a href="{{ url_for('public.home') }}" class="brand-mark" aria-label="Dude Fish Printing home">
    <span class="brand-mark__fish" aria-hidden="true">DF</span>
    <span><strong>Dude Fish</strong><small>Printing &middot; Clarksville, TN</small></span>
  </a>
  <nav id="public-nav" class="glass-nav__links" :class="{ 'is-open': menuOpen }">
    <a href="{{ url_for('public.shop') }}" @click="menuOpen = false" {% if request.endpoint in ['public.shop', 'public.product_detail', 'public.collection_detail'] %}aria-current="page"{% endif %}>Shop</a>
    <a href="{{ url_for('public.market_schedule') }}" @click="menuOpen = false" {% if request.endpoint == 'public.market_schedule' %}aria-current="page"{% endif %}>Markets</a>
    <a href="{{ url_for('public.gallery') }}" @click="menuOpen = false" {% if request.endpoint == 'public.gallery' %}aria-current="page"{% endif %}>Gallery</a>
    <a href="{{ url_for('public.printing_basics') }}" @click="menuOpen = false" {% if request.endpoint in ['public.printing_basics', 'public.materials', 'public.faq'] %}aria-current="page"{% endif %}>Learn</a>
    <a href="{{ url_for('public.about') }}" @click="menuOpen = false" {% if request.endpoint == 'public.about' %}aria-current="page"{% endif %}>Our story</a>
    <a href="{{ url_for('public.custom_orders') }}" @click="menuOpen = false" class="glass-nav__cta">Start a custom order</a>
  </nav>
  <div class="glass-nav__right">
    <a href="{{ url_for('public.cart') }}" class="glass-nav__cart" aria-label="Cart{% if public_cart_count %}, {{ public_cart_count }} items{% endif %}">
      Bag{% if public_cart_count %}<b>{{ public_cart_count }}</b>{% endif %}
    </a>
    <button class="glass-nav__toggle" type="button" @click.stop="menuOpen = !menuOpen" :aria-expanded="menuOpen.toString()" aria-controls="public-nav" aria-label="Toggle menu">
      <span x-text="menuOpen ? 'Close' : 'Menu'">Menu</span>
    </button>
  </div>
</header>
