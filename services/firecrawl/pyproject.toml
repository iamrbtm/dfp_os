[project]
name = "dfpos-firecrawl-adapter"
version = "0.1.0"
description = "Internal Firecrawl-compatible scrape adapter for DFPos Trend Scout"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.11.13",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["firecrawl*"]
