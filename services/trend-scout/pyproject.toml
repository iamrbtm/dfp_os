[project]
name = "dfp-trend-scout"
version = "0.1.0"
description = "Trend Scout microservice for Dude Fish OS"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "beautifulsoup4>=4.15.0",
    "celery>=5.5.0",
    "curl-cffi>=0.7.0",
    "fastapi>=0.115",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "lxml>=5.0",
    "numpy>=2.2.0",
    "openai>=1.68.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.7",
    "pytrends>=4.9.0",
    "redis[hiredis]>=5.2.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "sqlalchemy[asyncio]>=2.0",
    "tiktoken>=0.8.0",
    "uvicorn[standard]>=0.34",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20",
    "httpx>=0.28.1",
    "pytest>=8.4.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.11.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
pythonpath = ["."]
markers = [
    "slow: integration smoke tests that exercise real network calls; opt-in via -m slow",
]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
# Source files migrated from the Flask app have long user-agent strings we
# intentionally preserve verbatim. The line-length rule is the casualty.
"app/sources/*.py" = ["E501"]
# Tests use nested helper classes whose inner method names must differ from
# the outer class's `self` to avoid shadowing. The verbose N805 names are
# intentional.
"app/tests/*.py" = ["N805"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
