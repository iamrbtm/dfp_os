x-env-app: &env-app
  FLASK_ENV: ${FLASK_ENV:-production}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
  APP_NAME: ${APP_NAME:-Dude Fish OS}
  APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL must be set}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
  ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL must be set}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  AUDIT_LOG_BASE_URL: http://audit-log:8090
  AUDIT_LOG_TOKEN: ${AUDIT_LOG_TOKEN:?AUDIT_LOG_TOKEN must be set}
  AUDIT_LOG_ENABLED: ${AUDIT_LOG_ENABLED:-false}
  AUDIT_REDIS_URL: redis://redis:6379/0
  AUDIT_OUTBOX_KEY: ${AUDIT_OUTBOX_KEY:-audit:outbox}
  AUDIT_OUTBOX_MAX_SIZE: ${AUDIT_OUTBOX_MAX_SIZE:-100000}
  AUDIT_OUTBOX_FLUSH_INTERVAL_SECONDS: ${AUDIT_OUTBOX_FLUSH_INTERVAL_SECONDS:-30}
  AUDIT_OUTBOX_REPLAY_INTERVAL_SECONDS: ${AUDIT_OUTBOX_REPLAY_INTERVAL_SECONDS:-60}
  AUDIT_OUTBOX_BATCH_SIZE: ${AUDIT_OUTBOX_BATCH_SIZE:-200}
  AUDIT_OUTBOX_DLQ_PATH: ${AUDIT_OUTBOX_DLQ_PATH:-uploads/audit-queue}
  FILE_STORAGE_BACKEND: ${FILE_STORAGE_BACKEND:-s3}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://seaweedfs:8333}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
  S3_USE_SSL: ${S3_USE_SSL:-false}
  S3_AUTO_CREATE_BUCKETS: ${S3_AUTO_CREATE_BUCKETS:-true}
  RECEIPT_STORAGE_BUCKET: ${RECEIPT_STORAGE_BUCKET:-receipts}
  MARKET_DOCUMENTS_BUCKET: ${MARKET_DOCUMENTS_BUCKET:-markets}
  PRODUCT_ASSETS_BUCKET: ${PRODUCT_ASSETS_BUCKET:-products}
  RECEIPT_STORAGE_PATH: ${RECEIPT_STORAGE_PATH:-uploads/receipts}
  MARKET_DOCUMENTS_PATH: ${MARKET_DOCUMENTS_PATH:-uploads/markets}
  PRODUCT_ASSETS_PATH: ${PRODUCT_ASSETS_PATH:-uploads/products}
  RECEIPT_OCR_PROVIDER: ${RECEIPT_OCR_PROVIDER:-tesseract}
  RECEIPT_AI_PROVIDER: ${RECEIPT_AI_PROVIDER:-openai}
  AI_PROVIDER: ${AI_PROVIDER:-openai}
  AI_RECEIPT_PARSING_ENABLED: ${AI_RECEIPT_PARSING_ENABLED:-false}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
  OPENAI_MODEL_RECEIPTS: ${OPENAI_MODEL_RECEIPTS:-gpt-4o-mini}
  OPENAI_MODEL_ANALYTICS: ${OPENAI_MODEL_ANALYTICS:-gpt-4o-mini}
  OPENAI_MODEL_TREND_SCOUT: ${OPENAI_MODEL_TREND_SCOUT:-gpt-4o-mini}
  OPENAI_MODEL_MARKET_CATALOG: ${OPENAI_MODEL_MARKET_CATALOG:-gpt-4o-mini}
  OPENAI_MODEL_PRODUCT_STORY: ${OPENAI_MODEL_PRODUCT_STORY:-gpt-4o-mini}
  KILO_API_KEY: ${KILO_API_KEY:-}
  KILO_GATEWAY_BASE_URL: ${KILO_GATEWAY_BASE_URL:-https://api.kilo.ai/api/gateway}
  KILO_MODEL: ${KILO_MODEL:-anthropic/claude-sonnet-4.5}
  KILO_MODEL_RECEIPTS: ${KILO_MODEL_RECEIPTS:-anthropic/claude-sonnet-4.5}
  KILO_MODEL_ANALYTICS: ${KILO_MODEL_ANALYTICS:-anthropic/claude-sonnet-4.5}
  KILO_MODEL_TREND_SCOUT: ${KILO_MODEL_TREND_SCOUT:-anthropic/claude-sonnet-4.5}
  KILO_MODEL_MARKET_CATALOG: ${KILO_MODEL_MARKET_CATALOG:-anthropic/claude-sonnet-4.5}
  KILO_MODEL_PRODUCT_STORY: ${KILO_MODEL_PRODUCT_STORY:-anthropic/claude-sonnet-4.5}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
  OLLAMA_FALLBACK_URL: ${OLLAMA_FALLBACK_URL:-http://localhost:11434}
  OLLAMA_RECEIPT_MODEL: ${OLLAMA_RECEIPT_MODEL:-llama3}
  RECEIPT_DUPLICATE_STRICTNESS: ${RECEIPT_DUPLICATE_STRICTNESS:-normal}
  SLICER_ENABLED: ${SLICER_ENABLED:-true}
  SLICER_SERVICE_URL: http://slicer:8092
  SLICER_INTERNAL_API_TOKEN: ${SLICER_INTERNAL_API_TOKEN:?SLICER_INTERNAL_API_TOKEN must be set}
  INTELLIGENCE_ENABLED: ${INTELLIGENCE_ENABLED:-true}
  INTELLIGENCE_SERVICE_URL: http://intelligence:8091
  INTELLIGENCE_INTERNAL_API_TOKEN: ${INTELLIGENCE_INTERNAL_API_TOKEN:?INTELLIGENCE_INTERNAL_API_TOKEN must be set}

  TREND_SCOUT_ENABLED: ${TREND_SCOUT_ENABLED:-true}
  TREND_SCOUT_SERVICE_URL: http://trend-scout:8093
  TREND_SCOUT_INTERNAL_API_TOKEN: ${TREND_SCOUT_INTERNAL_API_TOKEN:?TREND_SCOUT_INTERNAL_API_TOKEN must be set}
  TREND_SCOUT_CELERY_QUEUE: trend_scout
  TREND_SCOUT_CELERY_TASK_PRIORITY: 1
  TREND_SCOUT_CELERY_DEFAULT_PRIORITY: 5
  TREND_SCOUT_CELERY_MAX_PRIORITY: 10
  TREND_SCOUT_FETCHER_POOL_WORKERS: 4
  TREND_SCOUT_FETCHER_TIMEOUT_SECONDS: 30
  TREND_SCOUT_PIPELINE_SOFT_TIME_LIMIT_SECONDS: 900
  TREND_SCOUT_PIPELINE_HARD_TIME_LIMIT_SECONDS: 960

x-depends-core: &depends-core
  db:
    condition: service_healthy
  redis:
    condition: service_healthy
  seaweedfs:
    condition: service_healthy

services:
  # ── Infrastructure ──────────────────────────

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      AUDIT_POSTGRES_DB: ${AUDIT_POSTGRES_DB:?AUDIT_POSTGRES_DB must be set}
      AUDIT_POSTGRES_USER: ${AUDIT_POSTGRES_USER:?AUDIT_POSTGRES_USER must be set}
      AUDIT_POSTGRES_PASSWORD: ${AUDIT_POSTGRES_PASSWORD:?AUDIT_POSTGRES_PASSWORD must be set}
      INTELLIGENCE_POSTGRES_DB: ${INTELLIGENCE_POSTGRES_DB:?INTELLIGENCE_POSTGRES_DB must be set}
      INTELLIGENCE_POSTGRES_USER: ${INTELLIGENCE_POSTGRES_USER:?INTELLIGENCE_POSTGRES_USER must be set}
      INTELLIGENCE_POSTGRES_PASSWORD: ${INTELLIGENCE_POSTGRES_PASSWORD:?INTELLIGENCE_POSTGRES_PASSWORD must be set}
      TREND_SCOUT_POSTGRES_DB: ${TREND_SCOUT_POSTGRES_DB:?TREND_SCOUT_POSTGRES_DB must be set}
      TREND_SCOUT_POSTGRES_USER: ${TREND_SCOUT_POSTGRES_USER:?TREND_SCOUT_POSTGRES_USER must be set}
      TREND_SCOUT_POSTGRES_PASSWORD: ${TREND_SCOUT_POSTGRES_PASSWORD:?TREND_SCOUT_POSTGRES_PASSWORD must be set}
    expose:
      - "5432"
    # Bind host:5433 → container:5432 so external clients (Beekeeper,
    # pgAdmin, etc.) on the LAN can reach the DFPos database. Host
    # port 5432 is already used by trio-postgres on this machine.
    ports:
      - "0.0.0.0:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/pg_hba_extra.conf:/etc/postgresql/pg_hba.conf.d/extra.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - "everysec"
      - --maxmemory-policy
      - "noeviction"
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  seaweedfs:
    image: chrislusf/seaweedfs:3.85
    command: "server -dir=/data -s3"
    environment:
      S3_ENABLE_AUTH: "true"
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
    expose:
      - "8333"
      - "9333"
    ports:
      - "${S3_HOST_PORT:-8333}:8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Build-cache images (build profile only) ──

  base-build:
    profiles: [build]
    build:
      context: .
      dockerfile: Dockerfile.base
    image: dfpos-base:local
    command: ["true"]

  slicer-base-build:
    profiles: [build]
    build:
      context: services/slicer
      dockerfile: Dockerfile.base
    image: dfpos-slicer-base:local
    command: ["true"]

  # ── Flask app + workers ─────────────────────

  web:
    build:
      context: .
      target: ${DOCKER_TARGET:-base}
    image: dfpos-app:local
    init: true
    mem_limit: 1024m
    environment:
      <<: *env-app
    ports:
      - "5000:5000"
    volumes:
      - receipt_uploads:/app/uploads/receipts
      - audit_queue:/app/uploads/audit-queue
    depends_on:
      <<: *depends-core
      slicer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    develop:
      watch:
        - path: ./app
          target: /app/app
          action: sync
          ignore:
            - "**/__pycache__/"
            - "**/*.pyc"
            - "**/.DS_Store"
        - path: ./migrations
          target: /app/migrations
          action: sync
        - path: ./pyproject.toml
          action: rebuild
        - path: ./uv.lock
          action: rebuild
        - path: ./package.json
          action: rebuild
        - path: ./package-lock.json
          action: rebuild

  worker:
    image: dfpos-app:local
    init: true
    mem_limit: 4096m
    environment:
      <<: *env-app
    volumes:
      - receipt_uploads:/app/uploads/receipts
      - audit_queue:/app/uploads/audit-queue
    depends_on:
      <<: *depends-core
      slicer:
        condition: service_healthy
    command:
      - celery
      - -A
      - app.celery_app.celery
      - worker
      - -Q
      - celery,trend_scout
      - --loglevel=info
      - --concurrency=2
      - --max-tasks-per-child=8
      - --without-mingle
      - --without-gossip
    develop:
      watch:
        - path: ./app
          target: /app/app
          action: sync
          ignore:
            - "**/__pycache__/"
            - "**/*.pyc"
            - "**/.DS_Store"
        - path: ./pyproject.toml
          action: rebuild
        - path: ./uv.lock
          action: rebuild

  beat:
    image: dfpos-app:local
    init: true
    mem_limit: 1024m
    environment:
      <<: *env-app
    volumes:
      - receipt_uploads:/app/uploads/receipts
      - audit_queue:/app/uploads/audit-queue
    depends_on:
      <<: *depends-core
      slicer:
        condition: service_healthy
    command: ["celery", "-A", "app.celery_app.celery", "beat", "--loglevel=info", "--schedule", "/app/instance/celerybeat-schedule"]

  # ── Dev tooling ─────────────────────────────

  tailwind-watch:
    profiles: [dev]
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - ./tailwind.config.js:/app/tailwind.config.js:ro
      - ./postcss.config.js:/app/postcss.config.js:ro
      - ./app/static:/app/app/static
      - ./app/templates:/app/app/templates:ro
      - tailwind_node_modules:/app/node_modules
    command: >
      sh -c "npm install --no-audit --no-fund --prefer-offline 2>/dev/null; npx tailwindcss -i ./app/static/src/input.css -o ./app/static/dist/app.css --watch"

  # ── One-shot services ───────────────────────

  migrate:
    image: dfpos-app:local
    profiles: [release]
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations/versions:/app/migrations/versions
    command: ["flask", "--app", "app:create_app", "db", "upgrade"]

  test:
    build:
      context: .
      target: dev
    image: dfpos-app-dev:local
    profiles: [test]
    environment:
      FLASK_ENV: testing
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/dfpos_test
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/dfpos_test
    depends_on:
      db:
        condition: service_healthy
    command: ["uv", "run", "pytest", "-v", "--tb=long"]

  # ── Microservices ───────────────────────────

  audit-log:
    build: services/audit-log
    image: dfpos-audit-log:local
    init: true
    environment:
      AUDIT_SERVICE_ENV: ${AUDIT_SERVICE_ENV:-production}
      AUDIT_SERVICE_NAME: ${AUDIT_SERVICE_NAME:-dfp-audit-log}
      AUDIT_API_HOST: 0.0.0.0
      AUDIT_API_PORT: 8090
      AUDIT_DATABASE_URL: postgresql+asyncpg://${AUDIT_POSTGRES_USER:?AUDIT_POSTGRES_USER must be set}:${AUDIT_POSTGRES_PASSWORD:?AUDIT_POSTGRES_PASSWORD must be set}@db:5432/${AUDIT_POSTGRES_DB:?AUDIT_POSTGRES_DB must be set}
      AUDIT_REDIS_URL: redis://redis:6379/0
      AUDIT_INTERNAL_API_TOKEN: ${AUDIT_LOG_TOKEN:?AUDIT_LOG_TOKEN must be set}
      AUDIT_HASH_SECRET: ${AUDIT_HASH_SECRET:?AUDIT_HASH_SECRET must be set}
      AUDIT_USE_REDIS_STREAM: ${AUDIT_USE_REDIS_STREAM:-false}
      AUDIT_LOG_LEVEL: ${AUDIT_LOG_LEVEL:-INFO}
    expose:
      - "8090"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8090"]

  intelligence:
    build: services/intelligence
    image: dfpos-intelligence:local
    init: true
    environment:
      INTELLIGENCE_SERVICE_ENV: ${INTELLIGENCE_SERVICE_ENV:-production}
      INTELLIGENCE_SERVICE_NAME: ${INTELLIGENCE_SERVICE_NAME:-dfp-intelligence}
      INTELLIGENCE_API_HOST: 0.0.0.0
      INTELLIGENCE_API_PORT: 8091
      INTELLIGENCE_DATABASE_URL: postgresql+asyncpg://${INTELLIGENCE_POSTGRES_USER:?INTELLIGENCE_POSTGRES_USER must be set}:${INTELLIGENCE_POSTGRES_PASSWORD:?INTELLIGENCE_POSTGRES_PASSWORD must be set}@db:5432/${INTELLIGENCE_POSTGRES_DB:?INTELLIGENCE_POSTGRES_DB must be set}
      INTELLIGENCE_INTERNAL_API_TOKEN: ${INTELLIGENCE_INTERNAL_API_TOKEN:?INTELLIGENCE_INTERNAL_API_TOKEN must be set}
      INTELLIGENCE_AUDIT_LOG_BASE_URL: http://audit-log:8090
      INTELLIGENCE_AUDIT_LOG_TOKEN: ${AUDIT_LOG_TOKEN:?AUDIT_LOG_TOKEN must be set}
    expose:
      - "8091"
    depends_on:
      db:
        condition: service_healthy
      audit-log:
        condition: service_started
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8091"]

  trend-scout:
    build: services/trend-scout
    image: dfpos-trend-scout:local
    init: true
    mem_limit: 1024m
    environment:
      TREND_SCOUT_SERVICE_ENV: ${FLASK_ENV:-production}
      TREND_SCOUT_SERVICE_NAME: ${TREND_SCOUT_SERVICE_NAME:-dfp-trend-scout}
      TREND_SCOUT_API_HOST: 0.0.0.0
      TREND_SCOUT_API_PORT: 8093
      TREND_SCOUT_DATABASE_URL: postgresql+asyncpg://${TREND_SCOUT_POSTGRES_USER:?TREND_SCOUT_POSTGRES_USER must be set}:${TREND_SCOUT_POSTGRES_PASSWORD:?TREND_SCOUT_POSTGRES_PASSWORD must be set}@db:5432/${TREND_SCOUT_POSTGRES_DB:?TREND_SCOUT_POSTGRES_DB must be set}
      TREND_SCOUT_REDIS_URL: redis://redis:6379/2
      TREND_SCOUT_CELERY_BROKER_URL: redis://redis:6379/1
      TREND_SCOUT_CELERY_RESULT_BACKEND: redis://redis:6379/1
      TREND_SCOUT_INTERNAL_API_TOKEN: ${TREND_SCOUT_INTERNAL_API_TOKEN:?TREND_SCOUT_INTERNAL_API_TOKEN must be set}
      TREND_SCOUT_AUDIT_LOG_BASE_URL: http://audit-log:8090
      TREND_SCOUT_AUDIT_LOG_TOKEN: ${AUDIT_LOG_TOKEN:?AUDIT_LOG_TOKEN must be set}
      TREND_SCOUT_AUDIT_LOG_ENABLED: ${AUDIT_LOG_ENABLED:-false}
      TREND_SCOUT_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TREND_SCOUT_OPENAI_MODEL_TREND_SCOUT: ${OPENAI_MODEL_TREND_SCOUT:-gpt-4o-mini}
      TREND_SCOUT_AI_PROVIDER: ${AI_PROVIDER:-openai}
      TREND_SCOUT_FETCHER_POOL_WORKERS: ${TREND_SCOUT_FETCHER_POOL_WORKERS:-4}
      TREND_SCOUT_FETCHER_TIMEOUT_SECONDS: ${TREND_SCOUT_FETCHER_TIMEOUT_SECONDS:-30}
    expose:
      - "8093"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      audit-log:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8093/health/live').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8093"]

  trend-scout-worker:
    build: services/trend-scout
    image: dfpos-trend-scout:local
    init: true
    mem_limit: 2048m
    environment:
      TREND_SCOUT_SERVICE_ENV: ${FLASK_ENV:-production}
      TREND_SCOUT_SERVICE_NAME: ${TREND_SCOUT_SERVICE_NAME:-dfp-trend-scout}
      TREND_SCOUT_DATABASE_URL: postgresql+asyncpg://${TREND_SCOUT_POSTGRES_USER:?TREND_SCOUT_POSTGRES_USER must be set}:${TREND_SCOUT_POSTGRES_PASSWORD:?TREND_SCOUT_POSTGRES_PASSWORD must be set}@db:5432/${TREND_SCOUT_POSTGRES_DB:?TREND_SCOUT_POSTGRES_DB must be set}
      TREND_SCOUT_REDIS_URL: redis://redis:6379/2
      TREND_SCOUT_CELERY_BROKER_URL: redis://redis:6379/1
      TREND_SCOUT_CELERY_RESULT_BACKEND: redis://redis:6379/1
      TREND_SCOUT_INTERNAL_API_TOKEN: ${TREND_SCOUT_INTERNAL_API_TOKEN:?TREND_SCOUT_INTERNAL_API_TOKEN must be set}
      TREND_SCOUT_AUDIT_LOG_BASE_URL: http://audit-log:8090
      TREND_SCOUT_AUDIT_LOG_TOKEN: ${AUDIT_LOG_TOKEN:?AUDIT_LOG_TOKEN must be set}
      TREND_SCOUT_AUDIT_LOG_ENABLED: ${AUDIT_LOG_ENABLED:-false}
      TREND_SCOUT_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TREND_SCOUT_OPENAI_MODEL_TREND_SCOUT: ${OPENAI_MODEL_TREND_SCOUT:-gpt-4o-mini}
      TREND_SCOUT_AI_PROVIDER: ${AI_PROVIDER:-openai}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uv", "run", "celery", "-A", "app.celery_app.celery", "worker", "-Q", "trend_scout", "--loglevel=info", "--concurrency=1"]

  trend-scout-migrate:
    build: services/trend-scout
    image: dfpos-trend-scout:local
    profiles: ["release"]
    environment:
      TREND_SCOUT_SERVICE_ENV: ${FLASK_ENV:-production}
      TREND_SCOUT_DATABASE_URL: postgresql+asyncpg://${TREND_SCOUT_POSTGRES_USER:?TREND_SCOUT_POSTGRES_USER must be set}:${TREND_SCOUT_POSTGRES_PASSWORD:?TREND_SCOUT_POSTGRES_PASSWORD must be set}@db:5432/${TREND_SCOUT_POSTGRES_DB:?TREND_SCOUT_POSTGRES_DB must be set}
    depends_on:
      db:
        condition: service_healthy
    command: ["uv", "run", "alembic", "upgrade", "head"]

  slicer:
    build:
      context: services/slicer
      args:
        DFPOS_IMAGE_TAG: local
    image: dfpos-slicer:local
    init: true
    mem_limit: 2048m
    environment:
      SLICER_SERVICE_ENV: ${SLICER_SERVICE_ENV:-production}
      SLICER_SERVICE_NAME: ${SLICER_SERVICE_NAME:-dfp-slicer}
      SLICER_API_HOST: 0.0.0.0
      SLICER_API_PORT: 8092
      SLICER_INTERNAL_API_TOKEN: ${SLICER_INTERNAL_API_TOKEN:?SLICER_INTERNAL_API_TOKEN must be set}
      SLICER_BAMBU_STUDIO_PATH: ${SLICER_BAMBU_STUDIO_PATH:-/opt/bambu-studio/AppRun}
      SLICER_BAMBU_PROFILE_ROOT: ${SLICER_BAMBU_PROFILE_ROOT:-/opt/bambu-studio/resources/profiles/BBL}
      SLICER_ENGINE_ORDER: ${SLICER_ENGINE_ORDER:-bambu,prusa}
      SLICER_PRUSA_SLICER_PATH: ${SLICER_PRUSA_SLICER_PATH:-prusa-slicer}
      SLICER_SLICE_TIMEOUT_SECONDS: ${SLICER_SLICE_TIMEOUT_SECONDS:-600}
      SLICER_METADATA_HEADER_MAX_BYTES: ${SLICER_METADATA_HEADER_MAX_BYTES:-6144}
      SLICER_MAX_MODEL_BYTES: ${SLICER_MAX_MODEL_BYTES:-268435456}
    expose:
      - "8092"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  api-docs:
    profiles: [docs]
    build: services/dfpos-api-docs
    image: dfpos-api-docs:local
    environment:
      DFPOS_OPENAPI_URL: http://web:5000/api/openapi.json
      APP_NAME: Dude Fish OS API Reference
      REDOC_THEME: light
      DOCS_USERNAME: ${DOCS_USERNAME:?DOCS_USERNAME must be set}
      DOCS_PASSWORD: ${DOCS_PASSWORD:?DOCS_PASSWORD must be set}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  receipt_uploads:
  audit_queue:
  seaweedfs_data:
  tailwind_node_modules:
