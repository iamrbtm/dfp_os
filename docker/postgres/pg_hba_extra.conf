# pg_hba.conf — custom HBA rules for the DFPos Postgres container.
#
# The default postgres:17 image ships with permissive rules that
# trust only 127.0.0.1/32 and require SCRAM-SHA-256 for everything
# else. This file layers additional rules on top so external
# clients on the LAN can authenticate with the right password.
#
# This file is mounted at /etc/postgresql/pg_hba.conf.d/extra.conf
# inside the container. Postgres reads every .conf file in that
# directory on startup.

# Allow LAN clients (192.168.0.0/16) to authenticate with the
# SCRAM-SHA-256 password stored in pg_authid.
host    all             all             192.168.0.0/16         scram-sha-256

# If you want to allow a specific client without a password
# (handy for read-only tools like pgAdmin in a trusted network),
# uncomment the next line. The dfpos role will still be required.
# host    all             dfpos           192.168.2.42/32        trust
